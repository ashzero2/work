[package]
name = "work-dashboard"
version = "0.1.0"
description = "Personal work dashboard: tasks, notes, Pomodoro, reminders."
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
gray_matter = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
dirs = "7"

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSpace", "NSWindow", "NSButton", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
